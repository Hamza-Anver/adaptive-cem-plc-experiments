[package]
name = "libafl_sandbox"
version = "0.1.0"
edition = "2021"

[lib]
name = "libafl_sandbox"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "libafl_sandbox"
path = "src/bin/main.rs"

[dependencies]
libafl = "0.15.4"
libafl_bolts = "0.15.4"
libafl_targets = { version = "0.15.4", features = ["sancov_pcguard_edges"] }
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
numpy = { version = "0.28.0", optional = true }
rayon = "1"

[build-dependencies]
cc = "1.2.60"

[features]
python = ["pyo3", "numpy"]